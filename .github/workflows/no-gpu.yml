name: No GPU

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A pull request's newer push cancels its older run; every push to main keeps its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zig:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-cache
          key: zig-probe-Linux-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: zig-probe-Linux-
      - name: zig build test
        run: zig build -Dname-tests test --test-timeout 10m --summary all
      - name: Cache size
        if: ${{ !cancelled() }}
        shell: bash
        run: du -sh .zig-cache .zig-cache/* || true
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() }}
        with:
          path: .zig-cache
          key: zig-probe-Linux-${{ github.run_id }}-${{ github.run_attempt }}
  zig-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-cache
          key: zig-probe-Windows-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: zig-probe-Windows-
      - name: zig build test
        run: zig build -Dname-tests test --test-timeout 10m --summary all
      - name: Cache size
        if: ${{ !cancelled() }}
        shell: bash
        run: du -sh .zig-cache .zig-cache/* || true
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() }}
        with:
          path: .zig-cache
          key: zig-probe-Windows-${{ github.run_id }}-${{ github.run_attempt }}
